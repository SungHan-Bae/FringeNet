# task8 — 라운드 2 (용량, 폭 축): convnext-match에서 **전 스테이지 dims x2** (변인 하나).
#
# 2,514,788 파라미터 (match 대비 x3.9). 해상도 사다리·수용영역 요건은 match와 동일
# (RF는 폭과 무관). 비교 규약은 resnet-w2 주석과 같다 — 파라미터당 이득으로 읽는다.
seed: 42
experiment: task8
run_name: convnext-w2

data:
  val_frac: 0.1
  subset: null

model:
  name: convnext
  dims: [64, 128, 192, 224]
  depths: [2, 2, 4, 2]
  kernel_size: 7
  mlp_ratio: 4
  output_bound: true

train:
  epochs: 100
  batch_size: 512
  lr: 1.0e-3
  weight_decay: 1.0e-4
  lr_schedule: cosine
  warmup_steps: 3300
  num_folds: 0
