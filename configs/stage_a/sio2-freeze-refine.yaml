# stage_a — phase 2: 채널별 공동 미세조정 (sio2-freeze 결과에서 초기화).
#
# 근거 (2026-08-11, docs/week_1.md): 매끈한 파라미터화(sio2-freeze)는 0.01254에서
# 정체하지만, 채널별 자유 TMM(채널마다 λ·n_SiN·n_Si·k_Si)은 전 채널 RMSE
# 0.0093~0.0099로 노이즈 바닥까지 내려간다 — TMM 모델족은 충분하고 경직성이 병목.
# 단일 자유도 절제(Δλ만/n_SiN만/Si만)로는 −0.0004 이하 → 결합 보정이 필요.
# 게이지(SiO₂ Cauchy freeze)와 λ 단조 파라미터화는 유지한 채, SiN·Si 곡선만
# 채널별(knot = 채널 수)로 풀어준다.
seed: 42
experiment: stage_a
run_name: sio2-freeze-refine

data:
  val_frac: 0.1
  fit_rows: 50000
  diag_rows: 20000

model:
  init_from_run: runs/stage_a/sio2-freeze   # phase 1 결과 곡선에서 초기화
  n_si_knots: 226      # 채널별 자유 (knot = 채널 수)
  n_sin_knots: 226

fit:
  steps: 2000
  batch_size: 4096
  lr: 3.0e-3           # 미세조정 — phase 1(1e-2)보다 보수적
  lr_schedule: cosine
  warmup_steps: 50
  eval_every: 100
  eval_batch: 8192
