# stage_a — Si 표 대안: Green 2008. `joint-lam3-sin2-si2`와 **si_source만** 다르다.
#
# 표 선택은 기하학 논증이 아니라 **측정**으로 한다 — 같은 에너지축 스플라인으로 평가하면
# 세 표의 E1 봉우리 위치가 3.5 meV 이내로 일치하므로 격자 간격 논거는 성립하지 않는다.
seed: 42
experiment: stage_a
run_name: joint-lam3-sin2-si2-green

data:
  fit_rows: 8000
  diag_rows: 20000

model:
  si_source: Si_nk_Green-2008.yml
  free: [lam_nu0, lam_r1, lam_r2, sin_b1, sin_c1, si_de, si_klog]
