# stage_a — 검정용: λ 절대 스케일의 독립 검증 (게이지 축퇴 깨기).
#
# δ = 2πnd/λ 는 (n, λ) 공통 스케일에 불변이라 **위상 정보만으로는** 둘을 동시에 식별할
# 수 없다. 이 run은 SiO₂에 배율 손잡이 1개를 주고 **Si 표를 동결**한다 — Si가 에너지축에
# 고정되면 임계점이 절대 앵커가 되고 Fresnel 진폭이 축퇴를 부분적으로 깬다. 적합값이
# 1에서 1% 이내로 돌아오면 통과.
#
# **이 설정을 디코더로 쓰지 말 것** — 게이지를 푼 진단용이다.
seed: 42
experiment: stage_a
run_name: gauge-sio2-scale

data:
  fit_rows: 8000
  diag_rows: 20000

model:
  si_source: Si_nk_Aspnes.yml
  # Si(si_de·si_klog)는 동결 — 임계점 절대 위치가 앵커여야 한다.
  free: [lam_nu0, lam_r1, lam_r2, sin_b1, sio2_scale]
