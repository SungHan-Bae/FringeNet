# stage_a — 검정용: λ 절대 스케일의 독립 검증 (게이지 축퇴 깨기).
#
# delta = 2*pi*n*d/lambda 는 (n, lambda)의 공통 스케일에 불변이므로 **위상 정보만으로는**
# 둘을 동시에 식별할 수 없다. 그래서 본 피팅은 SiO₂를 문헌값에 동결(게이지)하고 λ만 푼다 —
# λ의 절대 스케일은 그 가정에 의존하고, 상관행렬의 ν₀ ↔ SiN B₁ = −0.687이 그 축이다.
#
# 이 run은 그 가정을 검정한다: **SiO₂에 배율 손잡이 1개를 주고 Si 표를 동결**한다.
# Si는 에너지축에서 고정되므로 E1(3.40 eV)·E2(4.25 eV) 임계점이 **절대 앵커**가 되고,
# Fresnel 진폭이 위상 축퇴를 부분적으로 깬다. 적합된 sio2_scale이 1에서 1% 이내로
# 돌아오면 λ 그리드의 절대 스케일이 위상 외 정보로 확인된 것이다.
# 통과 기준: |sio2_scale − 1| < 0.01.
#
# **이 설정을 디코더로 쓰지 말 것** — 게이지를 푼 진단용이다.
seed: 42
experiment: stage_a
run_name: gauge-sio2-scale

data:
  fit_rows: 8000
  diag_rows: 20000

model:
  si_source: Si_nk_Aspnes.yml
  # Si(si_de·si_klog)는 동결 — 임계점 절대 위치가 앵커여야 한다.
  free: [lam_nu0, lam_r1, lam_r2, sin_b1, sio2_scale]
