# stage_a — 사다리 2단: λ 3계수를 추가로 해방해 공동 최소제곱 피팅.
#
# λ가 조금만 움직이면 독립적인 두 방법(두께축 주파수 식별 vs 전체 TMM 최소제곱)이 같은
# 답에 도달한 것이다. 이동량은 게이트 (f) λ 이동 절 — 채널별 추정의 산포 0.445 nm를
# 곡선의 오차 막대로 쓰면 안 된다.
seed: 42
experiment: stage_a
run_name: joint-lam3-sin1

data:
  fit_rows: 8000        # 자유도 1~7개에 관측 180만 개 — 표본 수는 병목이 아니다
  diag_rows: 20000      # 전 run 공통 진단 표본 (load_split이 상수로 고정)

model:
  si_source: Si_nk_Aspnes.yml
  free: [lam_nu0, lam_r1, lam_r2, sin_b1]
