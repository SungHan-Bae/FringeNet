# stage_a — 사다리 1단: λ 고정, SiN 손잡이 1개만.
#
# λ는 주파수 식별 결과의 **매끈한 3계수 곡선**에 고정한다. 채널별 원본 226개를 그대로
# 쓰면 안 된다 — 0.445 nm rms 흔들림(주파수 후보 격자 양자화에서 오는 결정론적 편향)이
# 있고 그것만으로 R 오차 rms 0.0052가 생겨 최종 모델의 계통오차 전체(0.0041)보다 크다.
#
# Si 표는 사다리 기준점이라 **Aspnes에 고정**한다 (채택 표는 Schinke — 표 교체 효과는
# 사다리 위쪽 3개 run이 같은 자유도에서 잰다). λ 동결 run이라 λ 초기값이 곧 모델이고,
# 그 초기값은 판정 표본을 2.74% 포함하므로 RMSE가 재표집에 1.8% 폭으로 조건부다
# (reports/stage_a.md 한계 절 — 채택 디코더는 영향 0).
seed: 42
experiment: stage_a
run_name: lam-frozen-sin1

data:
  fit_rows: 8000        # 자유도 1~7개에 관측 180만 개 — 표본 수는 병목이 아니다
  diag_rows: 20000      # 전 run 공통 진단 표본 (load_split이 상수로 고정)

model:
  si_source: Si_nk_Aspnes.yml
  free: [sin_b1]
