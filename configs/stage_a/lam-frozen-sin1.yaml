# stage_a — 사다리 1단: λ 고정, SiN 손잡이 1개만.
#
# λ는 두께축 주파수 식별 결과의 **매끈한 3계수 곡선**에 고정한다. 채널별 원본 226개를
# 그대로 쓰면 안 된다 — 거기에는 0.445 nm rms 흔들림이 있고(다항 차수를 1→6으로 올려도
# 줄지 않는다: 정체는 잡음이 아니라 주파수 후보 격자 양자화에서 오는 **결정론적 추정량
# 편향**이다 — 08-13 정정), 그것만으로 R 오차 rms 0.0052가 생겨 최종 모델에 남은
# 계통오차 전체(0.0041)보다 커진다.
#
# Si는 문헌 원본 실측표 + 에너지축 3차 스플라인, 동결. 이 run은 사다리 기준점이라
# 표를 **Aspnes에 고정**해 둔다 (채택 표는 Schinke — 표 교체 효과는 사다리 위쪽
# 3개 run이 같은 자유도에서 재고, 여기서 바꾸면 대조군이 두 축으로 움직인다).
#
# **주의**: λ를 동결하는 run이라 λ 초기값이 곧 모델이고, 그 초기값은 판정 표본을
# 2.74% 포함한 식별 산출물이다 — RMSE가 재표집에 1.8% 폭으로 조건부이고 현행 값이
# 그 범위의 낙관적 끝이다 (reports/stage_a_leakage.md). 채택 디코더는 영향 0.
seed: 42
experiment: stage_a
run_name: lam-frozen-sin1

data:
  fit_rows: 8000        # 자유도 1~7개에 관측 180만 개 — 표본 수는 병목이 아니다
  diag_rows: 20000      # 전 run 공통 진단 표본 (load_split이 상수로 고정)

model:
  si_source: Si_nk_Aspnes.yml
  free: [sin_b1]
