# stage_a — 검정용: **연속 블록** 채널 홀드아웃 (단파장 끝 ch206–225).
#
# `holdout-channels`(균등 간격 20채널)는 요구가 약하다 — 이웃 채널이 강상관이라 사실상
# 보간이고, 전 226채널로 적합한 모델도 같은 채널에서 비슷한 오차를 내므로 홀드아웃의
# 한계 효과가 +0.3%뿐이다 (08-13 리뷰). 대역 끝 20채널을 **통째로** 빼면 진짜 외삽이
# 되고, 그래도 그 채널의 R을 예측한다면 λ·물성이 매끈한 함수라는 것이 훨씬 강하게
# 입증된다. 단파장 끝을 고른 이유: Luke Sellmeier 유효범위(310 nm) 밖이고 c-Si 임계점
# E2가 있어 가장 어려운 구간이다.
#
# 나머지 설정은 joint-lam3-sin2-si2와 동일.
seed: 42
experiment: stage_a
run_name: holdout-block-uv

data:
  fit_rows: 8000
  diag_rows: 20000

model:
  si_source: Si_nk_Aspnes.yml
  holdout_channel_range: [206, 225]   # 연속 20채널 — 균등 간격판과 같은 개수
  free: [lam_nu0, lam_r1, lam_r2, sin_b1, sin_c1, si_de, si_klog]
