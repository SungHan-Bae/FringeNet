# stage_a — 검정용: **연속 블록** 채널 홀드아웃 (단파장 끝 ch206–225).
#
# 대역 끝 20채널을 통째로 빼면 진짜 외삽이 되고, 그래도 R을 예측한다면 λ·물성이 매끈한
# 함수라는 것이 훨씬 강하게 입증된다. 단파장 끝을 고른 이유: Luke Sellmeier 유효범위
# (310 nm) 밖이고 c-Si E2 임계점이 있어 대역에서 가장 어려운 구간이다.
seed: 42
experiment: stage_a
run_name: holdout-block-uv

data:
  fit_rows: 8000
  diag_rows: 20000

model:
  si_source: Si_nk_Aspnes.yml
  holdout_channel_range: [206, 225]   # 연속 20채널 — 균등 간격판과 같은 개수
  free: [lam_nu0, lam_r1, lam_r2, sin_b1, sin_c1, si_de, si_klog]
