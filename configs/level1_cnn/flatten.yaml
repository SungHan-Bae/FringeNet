# level1_cnn — flatten 헤드: 기준(single-scale, GAP) 대비 조작 변인은 head 하나.
#
# 가설 (첫 결과의 진단): GAP 18.16 nm < shuffled 12.23 nm 역전은 위치 불변성이
# 병목이라는 증거 — 이 태스크의 정보는 fringe의 파장축 절대 위치·위상에 있다.
# flatten은 conv의 국소성은 유지하고 위치 정보만 보존한다 (C_last=280 x W_last=15
# -> 4200 -> Linear). 파라미터 662,020 (+2.4% vs MLP 646,660 — ±10% 통제 유지).
seed: 42
experiment: level1_cnn
run_name: flatten

data:
  val_frac: 0.1
  subset: null

model:
  name: cnn
  channels: [32, 64, 128, 200, 280]
  strides: [1, 2, 2, 2, 2]
  kernel_sizes: [7]
  activation: gelu
  norm: batchnorm
  dropout: 0.0
  head: flatten                      # 유일한 변경점 (기준: gap)
  output_bound: false
  channel_shuffle_seed: null

train:
  epochs: 30
  batch_size: 512
  lr: 1.0e-3
  weight_decay: 1.0e-4
  lr_schedule: cosine
  warmup_steps: 1000
  num_folds: 0
