# level1_cnn — flatten 헤드: single-scale 대비 조작 변인은 head 하나.
#
# GAP는 파장축을 평균으로 붕괴시킨다. flatten은 conv의 국소성을 유지하고 위치 정보만
# 보존한다 (C_last 280 × W_last 15 → 4200 → Linear). 파라미터 662,020 (+2.4% vs MLP).
seed: 42
experiment: level1_cnn
run_name: flatten

data:
  val_frac: 0.1
  subset: null

model:
  name: cnn
  channels: [32, 64, 128, 200, 280]
  strides: [1, 2, 2, 2, 2]
  kernel_sizes: [7]
  activation: gelu
  norm: batchnorm
  dropout: 0.0
  head: flatten                      # 유일한 변경점 (기준: gap)
  output_bound: false
  channel_shuffle_seed: null

train:
  epochs: 30
  batch_size: 512
  lr: 1.0e-3
  weight_decay: 1.0e-4
  lr_schedule: cosine
  warmup_steps: 1000
  num_folds: 0
