# level1_cnn — flatten + dilated: flatten 대비 조작 변인은 dilations 하나.
#
# 위치 보존과 수용영역 확장은 직교하는 축이므로, flatten과의 차이가 "위치 보존 하에서
# 넓은 수용영역의 추가 기여"를 측정한다. 파라미터 662,020.
seed: 42
experiment: level1_cnn
run_name: flatten-dilated

data:
  val_frac: 0.1
  subset: null

model:
  name: cnn
  channels: [32, 64, 128, 200, 280]
  strides: [1, 2, 2, 2, 2]
  kernel_sizes: [7]
  dilations: [1, 2, 4, 4, 2]
  activation: gelu
  norm: batchnorm
  dropout: 0.0
  head: flatten
  output_bound: false
  channel_shuffle_seed: null

train:
  epochs: 30
  batch_size: 512
  lr: 1.0e-3
  weight_decay: 1.0e-4
  lr_schedule: cosine
  warmup_steps: 1000
  num_folds: 0
