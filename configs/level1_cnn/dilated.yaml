# level1_cnn — dilated conv: single-scale 대비 조작 변인은 dilations 하나.
#
# dilation은 파라미터·연산량을 바꾸지 않고 수용영역만 넓힌다 — 통제가 공짜다.
# RF 97채널 → (1,2,4,4,2)로 259채널(전 대역). 블록별 값은 입력 길이
# (226/113/57/29/15)에서 유효 span(6d+1)이 넘치지 않는 최대 수준.
seed: 42
experiment: level1_cnn
run_name: dilated

data:
  val_frac: 0.1
  subset: null

model:
  name: cnn
  channels: [32, 64, 128, 200, 280]
  strides: [1, 2, 2, 2, 2]
  kernel_sizes: [7]
  dilations: [1, 2, 4, 4, 2]         # 유일한 변경점 (기준: 전부 1)
  activation: gelu
  norm: batchnorm
  dropout: 0.0
  head: gap
  output_bound: false
  channel_shuffle_seed: null

train:
  epochs: 30
  batch_size: 512
  lr: 1.0e-3
  weight_decay: 1.0e-4
  lr_schedule: cosine
  warmup_steps: 1000
  num_folds: 0
