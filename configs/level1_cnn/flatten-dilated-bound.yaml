# level1_cnn — flatten-dilated + output bound: 조작 변인은 output_bound 하나. **확정 백본.**
#
# sigmoid bound는 출력을 물리 범위 [10, 300] nm에 가두지만 격자 양 끝에서 gradient가
# 죽는 비용이 있다. MLP baseline에서는 bare regression이 이겼다 — 강한 백본에서도 같은
# 결론인지 본다. bias 중앙 초기화는 bound 유무와 무관하게 동일(공정 비교).
seed: 42
experiment: level1_cnn
run_name: flatten-dilated-bound

data:
  val_frac: 0.1
  subset: null

model:
  name: cnn
  channels: [32, 64, 128, 200, 280]
  strides: [1, 2, 2, 2, 2]
  kernel_sizes: [7]
  dilations: [1, 2, 4, 4, 2]
  activation: gelu
  norm: batchnorm
  dropout: 0.0
  head: flatten
  output_bound: true
  channel_shuffle_seed: null

train:
  epochs: 30
  batch_size: 512
  lr: 1.0e-3
  weight_decay: 1.0e-4
  lr_schedule: cosine
  warmup_steps: 1000
  num_folds: 0
