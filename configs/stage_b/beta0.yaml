# stage_b — beta0: 물리 손실 off 대조군 (Task 7 ablation의 기준선).
#
# 백본은 Level 1 확정 flatten-dilated-bound(reports/level1_cnn.md, holdout 2.346 nm)
# 그대로 — 시드·프로토콜이 같으므로 이 run은 level1 결과의 재현이 되어야 하고,
# beta>0 변형과의 차이가 곧 물리 손실의 기여다. physics 블록 생략 = beta 0과 등가.
seed: 42
experiment: stage_b
run_name: beta0

data:
  val_frac: 0.1
  subset: null

model:
  name: cnn
  channels: [32, 64, 128, 200, 280]
  strides: [1, 2, 2, 2, 2]
  kernel_sizes: [7]
  dilations: [1, 2, 4, 4, 2]
  activation: gelu
  norm: batchnorm
  dropout: 0.0
  head: flatten
  output_bound: true
  channel_shuffle_seed: null

train:
  epochs: 30
  batch_size: 512
  lr: 1.0e-3
  weight_decay: 1.0e-4
  lr_schedule: cosine
  warmup_steps: 1000
  num_folds: 0
