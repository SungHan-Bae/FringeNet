# stage_b — 물리 손실 beta ablation의 **대조군**. 조작 변인은 train.physics.beta 하나.
#
# 백본은 Level 1 확정(flatten-dilated-bound). beta=0이면 물리 항이 gradient에 들어가지 않고
# 진단으로만 기록되므로 학습 경로가 물리 항 도입 전과 같다 — 이 run의 holdout MAE는
# level1_cnn/flatten-dilated-bound의 재현이기도 하다 (GPU 기종이 다르면 MAE 수준 비교).
# 사전등록 예측은 docs/week_1.md TODO에 있다.
seed: 42
experiment: stage_b
run_name: beta0

data:
  val_frac: 0.1
  subset: null

model:
  name: cnn
  channels: [32, 64, 128, 200, 280]
  strides: [1, 2, 2, 2, 2]
  kernel_sizes: [7]
  dilations: [1, 2, 4, 4, 2]
  activation: gelu
  norm: batchnorm
  dropout: 0.0
  head: flatten
  output_bound: true
  channel_shuffle_seed: null

train:
  epochs: 30
  batch_size: 512
  lr: 1.0e-3
  weight_decay: 1.0e-4
  lr_schedule: cosine
  warmup_steps: 1000 # 학습률 워밍업 (물리 항 워밍업은 physics.warmup_steps)
  num_folds: 0
  physics:
    decoder: runs/stage_a/joint-lam3-sin2-si2-schinke/model.pt
    beta: 0.0
    warmup_steps: 3000
