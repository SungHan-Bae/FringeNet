# stage_b — **수렴 후 물리 fine-tune**의 대조군 (라운드 3). 조작 변인은 physics.beta 하나.
#
# 가설: 라운드 1·2에서 물리 항의 손해는 대부분 최적화 지연이었다(원 열화의 77~99%). 물리
# 손실 표면은 fringe 차수마다 국소 최소가 있어 랜덤 초기화에서는 잘못된 분지로 끌려갈 수
# 있으므로, **이미 올바른 분지에 든 수렴 모델에서 출발해** 물리 항을 시험한다.
#
# split·init_from은 네 run이 공유하고, 출처는 라운드 2의 대조군이다 — 같은 split에서 학습된
# 체크포인트여야 한다 (다른 split이면 출처 모델이 이미 본 행이 holdout에 들어가 누수다.
# train_gpu가 출처 metrics.json의 data 블록을 대조해 막는다).
#
# 이 split을 고른 이유: 라운드 2 대조군의 후반 val은 흔들리는 **정체 구간**이다
# (24~30에폭: 4.19 → 4.23 → 4.15 → 4.11 → 4.06 → 4.07 → 4.08 — 29·30의 상승은 그 진폭 안이다).
# train_l1은 계속 내려가므로 예산을 충분히 더 주면 실제 과적합에 들어가고, 그때 "물리 항이
# 정규화로 작동하나"가 검정 가능해진다. 대조군도 같은 LR·같은 에폭을 돌므로 개선이 나오면
# 추가 학습 예산 몫인지 물리 항 몫인지 분리된다.
#
# **epochs 40의 근거는 실측이다.** 8에폭 예비 실행에서 대조군이 4.0612 → 3.9953으로 내려갔는데
# **마지막 에폭이 best였고 아직 하강 중에 LR이 0으로 소진돼 끝났다** (라운드 1·2와 같은 패턴 —
# 수렴이 아니라 예산 소진). 그 상태로는 "수렴 지점에서 물리 항이 작동하나"를 판정할 수 없다.
# 40에폭 = 41,520스텝이고, lr 1e-4 코사인의 적분 LR이 라운드 2의 약 1/7.5라 재학습이 아니라
# 국소 정련에 머문다 (warm start 전제 보존). 4런 합계 55.1초/에폭 실측 → 약 37분.
#
# **라운드 1·2와 MAE를 직접 비교하지 말 것** — 학습 예산·LR 스케줄이 다르다. 유효한 비교는
# 이 라운드 안에서의 beta 대조뿐이고, 판정은 `scripts/analyze_stage_b_curves.py`로 적합 수준을
# 맞춰서 읽는다 (원 비교만 보면 라운드 1과 같은 함정에 빠진다).
seed: 42
experiment: stage_b
run_name: ft-heldout-beta0

data:
  # 출처 체크포인트와 **같은 split이어야 한다** (위 주석 참조)
  subset: null
  holdout_thickness: [70, 150, 230]

model:
  name: cnn
  channels: [32, 64, 128, 200, 280]
  strides: [1, 2, 2, 2, 2]
  kernel_sizes: [7]
  dilations: [1, 2, 4, 4, 2]
  activation: gelu
  norm: batchnorm
  dropout: 0.0
  head: flatten
  output_bound: true
  channel_shuffle_seed: null

train:
  # 라운드 2 대조군의 best 체크포인트. git에 없으므로(runs/는 텍스트만 추적) Drive 미러에서
  # 받아와야 한다 — 노트북이 학습 전에 model.pt만 복사한다 (metrics.json은 git이 정본).
  init_from: runs/stage_b/heldout-thickness-beta0/model.pt
  epochs: 40
  batch_size: 512
  # 수렴 모델에서 출발하므로 원래 LR(1e-3)을 쓰면 첫 에폭에 망친다. 10배 작게.
  lr: 1.0e-4
  weight_decay: 1.0e-4
  lr_schedule: cosine
  warmup_steps: 0 # 이미 수렴한 가중치라 LR 워밍업이 필요 없다 (짧은 run에서 예산만 먹는다)
  num_folds: 0
  physics:
    decoder: runs/stage_a/joint-lam3-sin2-si2-schinke/model.pt
    beta: 0.0
    # 워밍업의 이유(랜덤 모델의 거대한 초기 잔차)가 여기엔 해당 안 된다 — 수렴 모델의
    # 재구성 L1은 이미 0.05 수준이다. 총 41,520스텝(531,441/512 x 40)의 0.7%만 써서
    # 물리 항이 run의 99%에서 켜져 있게 한다 (효과를 β에 귀속시키기 위해).
    warmup_steps: 300
