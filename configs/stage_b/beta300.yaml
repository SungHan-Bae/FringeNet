# stage_b — 물리 손실 beta ablation (beta = 300). 조작 변인은 train.physics.beta 하나.
# 백본·대조군·사전등록은 beta0.yaml 참조. beta 300 = 물리 항이 지도 항을 압도하는 상한 쪽 끝점.
seed: 42
experiment: stage_b
run_name: beta300

data:
  val_frac: 0.1
  subset: null

model:
  name: cnn
  channels: [32, 64, 128, 200, 280]
  strides: [1, 2, 2, 2, 2]
  kernel_sizes: [7]
  dilations: [1, 2, 4, 4, 2]
  activation: gelu
  norm: batchnorm
  dropout: 0.0
  head: flatten
  output_bound: true
  channel_shuffle_seed: null

train:
  epochs: 30
  batch_size: 512
  lr: 1.0e-3
  weight_decay: 1.0e-4
  lr_schedule: cosine
  warmup_steps: 1000 # 학습률 워밍업 (물리 항 워밍업은 physics.warmup_steps)
  num_folds: 0
  physics:
    decoder: runs/stage_a/joint-lam3-sin2-si2-schinke/model.pt
    beta: 300.0
    warmup_steps: 3000
