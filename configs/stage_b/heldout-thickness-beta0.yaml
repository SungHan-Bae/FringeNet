# stage_b — **held-out 두께 값 split**의 대조군 (라운드 2). 조작 변인은 physics.beta 하나.
#
# 70·150·230 nm를 전 층에서 빼 학습 27⁴ = 531,441행 / holdout 278,559행이 된다.
# 값 선택: 양 끝(10·300)은 sigmoid bound와 얽히고, layer_4 민감도가 꺼지는 40~60 nm는 두 효과가
# 섞인다 — 대역에 고르게 퍼진 내부 값 3개.
#
# **라운드 1(무작위 split)과 MAE를 직접 비교하지 말 것** — 학습 행이 27% 적고 holdout이 다른
# 문제다. 유효한 비교는 이 split 안에서의 beta 대조뿐이다.
seed: 42
experiment: stage_b
run_name: heldout-thickness-beta0

data:
  # val_frac은 쓰지 않는다 — 분할이 두께 값으로 정해진다
  subset: null
  holdout_thickness: [70, 150, 230]

model:
  name: cnn
  channels: [32, 64, 128, 200, 280]
  strides: [1, 2, 2, 2, 2]
  kernel_sizes: [7]
  dilations: [1, 2, 4, 4, 2]
  activation: gelu
  norm: batchnorm
  dropout: 0.0
  head: flatten
  output_bound: true
  channel_shuffle_seed: null

train:
  epochs: 30
  batch_size: 512
  lr: 1.0e-3
  weight_decay: 1.0e-4
  lr_schedule: cosine
  warmup_steps: 1000 # 학습률 워밍업 (물리 항 워밍업은 physics.warmup_steps)
  num_folds: 0
  physics:
    decoder: runs/stage_a/joint-lam3-sin2-si2-schinke/model.pt
    beta: 0.0
    warmup_steps: 3000
