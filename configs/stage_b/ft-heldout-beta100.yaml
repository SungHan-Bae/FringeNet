# stage_b — **수렴 후 물리 fine-tune** (라운드 3, beta = 100).
# 조작 변인은 physics.beta 하나이고, 가설·split·init_from·LR 근거는
# ft-heldout-beta0.yaml 참조. beta 100 = 두 항의 기여가 같은 자리수로 맞는 지점.

seed: 42
experiment: stage_b
run_name: ft-heldout-beta100

data:
  # 출처 체크포인트와 **같은 split이어야 한다** (위 주석 참조)
  subset: null
  holdout_thickness: [70, 150, 230]

model:
  name: cnn
  channels: [32, 64, 128, 200, 280]
  strides: [1, 2, 2, 2, 2]
  kernel_sizes: [7]
  dilations: [1, 2, 4, 4, 2]
  activation: gelu
  norm: batchnorm
  dropout: 0.0
  head: flatten
  output_bound: true
  channel_shuffle_seed: null

train:
  # 라운드 2 대조군의 best 체크포인트. git에 없으므로(runs/는 텍스트만 추적) Drive 미러에서
  # 받아와야 한다 — 노트북이 학습 전에 model.pt만 복사한다 (metrics.json은 git이 정본).
  init_from: runs/stage_b/heldout-thickness-beta0/model.pt
  epochs: 8
  batch_size: 512
  # 수렴 모델에서 출발하므로 원래 LR(1e-3)을 쓰면 첫 에폭에 망친다. 10배 작게.
  lr: 1.0e-4
  weight_decay: 1.0e-4
  lr_schedule: cosine
  warmup_steps: 0 # 이미 수렴한 가중치라 LR 워밍업이 필요 없다 (짧은 run에서 예산만 먹는다)
  num_folds: 0
  physics:
    decoder: runs/stage_a/joint-lam3-sin2-si2-schinke/model.pt
    beta: 100.0
    # 3,000은 30에폭 처음부터 학습용 값이다. 여기는 총 8,304스텝(531,441/512 x 8)이라
    # 3,000이면 36%를 먹는다. 게다가 워밍업의 이유(랜덤 모델의 거대한 초기 잔차)가 해당
    # 안 된다 — 수렴 모델의 재구성 L1은 이미 0.05 수준이다. 3.6%만 쓴다.
    warmup_steps: 300
