[project]
name = "fringenet"
version = "0.1.0"
description = "Physics-informed deep learning for thin-film thickness metrology"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
# 노트북은 탐색용이라 린트 대상이 아니다 (재사용 로직은 src/로 승격한다는 규약).
extend-exclude = ["data", "runs", "notebooks", "*.ipynb"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "NPY", # numpy-specific
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
